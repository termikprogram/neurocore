name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  portable:
    # Platformdan bağımsız çekirdek testleri — Windows ve Linux'ta aynı sonucu verir
    name: portable · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install portable core only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-base.txt

      - name: Show platform capabilities
        run: python -m neurocore.platform

      - name: Portable unit tests (no GPU, no Windows extras)
        run: >
          python -m unittest
          tests.test_platform
          tests.test_refactor
          tests.test_codeindex
          tests.test_codeast
          tests.test_bigfile
          tests.test_toolresult
          tests.test_envcheck
          tests.test_handoff
          tests.test_checkpoint

  windows-full:
    # Tam paket (test_app vb.) burada ÇALIŞMAZ: torch, ekran görüntüsü ve
    # PowerShell oturumu gerektirir; CI'da 8-12 dk sürüp ortama bağlı düşüyor.
    # Yerelde çalıştırın:  python -m unittest discover -s tests -p "test_*.py"
    name: full suite (manual) · windows-latest
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-base.txt
          python -m pip install -r requirements-windows.txt
      - name: Full unit suite
        run: python -m unittest discover -s tests -p "test_*.py"

  import-smoke:
    # torch ve pywinauto OLMADAN çekirdek içe aktarılabilmeli
    name: import smoke · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-base.txt
      - name: Core imports must work without torch / pywinauto
        run: |
          python -c "import neurocore; print('neurocore', neurocore.__version__)"
          python -c "from neurocore.platform import ozellikler; print(ozellikler()['gpu_backend'])"
          python -c "from neurocore.agent.loop import AgentLoop; print('loop ok')"
          python -c "from neurocore.agent import bigfile, codeindex, refactor; print('agent tools ok')"
